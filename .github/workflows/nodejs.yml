# 改进后的完整 nodejs.yml（适配 express-jest-example 项目）
name: Node.js CI for express-jest-example

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # 新增：运行测试并生成覆盖率报告（适配该项目的测试脚本）
      - name: Run tests with code coverage
        run: npm test
      # 新增：上传覆盖率报告为 Artifact（方便下载）
      - name: Upload code coverage report
        uses: actions/upload-artifact@v4
        with:
          name: express-jest-coverage-report # 命名关联项目
          path: ./coverage # Jest 默认覆盖率报告目录（该项目通用）

          # 新增：上传覆盖率报告为 Artifact（方便下载）